<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ safe_subject }}</title>
</head>
<body style="margin:0;padding:0;background:#efeff7;font-family:Verdana,Geneva,Tahoma,sans-serif;color:#111827;">
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background:#efeff7;padding:14px 0;">
        <tr>
            <td align="center">
                <table role="presentation" cellpadding="0" cellspacing="0" width="620" style="max-width:620px;background:#ffffff;border-radius:12px;border:1px solid #e5e7eb;overflow:hidden;">

                    <!-- Header bar -->
                    <tr>
                        <td align="center" style="padding:18px 22px 10px;">
                            <div style="font-size:24px;line-height:1;color:#111827;font-weight:700;">
                                <span style="font-size:22px;color:#6b5cff;font-weight:700;">&#10022;</span> Shadow
                            </div>
                            <div style="margin-top:4px;font-size:12px;color:#4b5563;">Your AI-powered life and career assistant</div>
                        </td>
                    </tr>
                    <tr><td style="height:2px;background:linear-gradient(90deg,#6b5cff 0%,#a78bfa 100%);"></td></tr>

                    <!-- Day header -->
                    <tr>
                        <td align="center" style="padding:32px 36px 16px;">
                            <div style="font-size:38px;line-height:1;margin-bottom:12px;">&#127774;</div>
                            <p style="margin:0;font-size:13px;color:#6b7280;">{{ safe_day }}</p>
                        </td>
                    </tr>

                    <!-- Brief body (paragraphs injected as <p> tags) -->
                    <tr>
                        <td style="padding:0 36px 32px;">
                            {{ safe_brief_text }}
                        </td>
                    </tr>

                    <!-- CTA -->
                    <tr>
                        <td align="center" style="padding:0 36px 32px;">
                            <a href="{{ safe_cta_url }}" style="display:inline-block;background:#6b5cff;border-radius:8px;color:#ffffff;text-decoration:none;padding:12px 32px;font-size:14px;font-weight:700;">View Today's Brief →</a>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding:0 20px 20px;">
                            <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="border-top:1px solid #e5e7eb;">
                                <tr><td align="center" style="padding-top:12px;font-size:12px;color:#4b5563;">Need help? Contact us at {{ safe_support_email }}</td></tr>
                                <tr><td align="center" style="padding-top:6px;font-size:11px;color:#9ca3af;">{{ safe_footer }}</td></tr>
                                <tr><td align="center" style="padding-top:6px;font-size:11px;color:#9ca3af;"><a href="{{ safe_unsub_url }}" style="color:#9ca3af;">Unsubscribe from email notifications</a></td></tr>
                            </table>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
